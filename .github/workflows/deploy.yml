name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let in-flight runs finish so we never
# publish an older build after a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -e
          mkdir -p dist
          # VAHFR Portaal.dc.html is the live homepage. It renders itself
          # client-side via support.js, so no build step is needed here -
          # publishing it as index.html is enough to pick up any edit.
          cp "VAHFR Portaal.dc.html" dist/index.html
          # VAHFR Handleiding.dc.html is loaded at runtime as a sibling
          # component via a relative fetch, so it must be published too.
          cp "VAHFR Handleiding.dc.html" dist/
          cp support.js dist/support.js
          cp -R uploads dist/uploads
          [ -f CNAME ] && cp CNAME dist/CNAME
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
